[project]
name = "diffusers-recipes"
version = "0.1.0"
description = "Recipes for using diffusers with different optimizations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.14.0",
  "diffusers>=0.41.0.dev0",
  "diffusers-mm>=0.4.0",
  "peft>=0.20.0",
  "torch>=2.13.0",
  "torchaudio>=2.11.0",
  "torchcodec>=0.16.0",
  "torchvision>=0.28.0",
  "transformers>=5.16.1",
]

[project.optional-dependencies]
benchmark = ["nvidia-ml-py>=13.610.43"]
quantization = [
  "bitsandbytes>=0.50.2",
  "torchao>=0.18.0",
  "gguf>=0.19.0",
  "sdnq>=0.2.8",
]
attentions = ["kernels>=0.16.1"]
video = ["av>=18.1.0"]
all = [
  "nvidia-ml-py>=13.610.43",
  "bitsandbytes>=0.50.2",
  "torchao>=0.18.0",
  "gguf>=0.19.0",
  "sdnq>=0.2.8",
  "kernels>=0.16.1",
  "av>=18.1.0",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "S",    # flake8-bandit
  "BLE",  # flake8-blind-except
  "EXE",  # flake8-executable
  "PIE",  # flake8-pie
  "SIM",  # flake8-simplify
  "PERF", # perflint
  "TRY",  # tryceratops
  "RUF",  # ruff-specific
]
ignore = [
  "E501",    # line length is handled by the formatter; recipe prompts are long single strings
  "RUF001",  # prompts intentionally contain typographic quotes/dashes
  "RUF003",
  "TRY003",  # long messages inline are fine for a flat script
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
diffusers = { git = "https://github.com/huggingface/diffusers", rev = "d42ebf9c6e0b46103b74283f5324357a67acaa04" }
